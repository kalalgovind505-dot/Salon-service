server:
  port: 5000

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # BOOKING SERVICE
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**

        # USER SERVICE
        - id: auth-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**, /api/admin/users/**, /api/users/**, /users/**,/auth/**

        # SALON SERVICE
        - id: salon-service
          uri: lb://SALON-SERVICE
          predicates:
            - Path=/api/salons,/api/salons/**

            # AUTH APIs ✅ ADD THIS


        # SERVICE OFFERING
        - id: service-offering
          uri: lb://SERVICE-OFFERING
          predicates:
            - Path=/api/service-offering/**

        # CATEGORY SERVICE
        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/categories/**


        - id: notifications-service
          uri: lb://NOTIFICATIONS-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/review/**



        # PAYMENT SERVICE
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**


  security:
    oauth2:
      resource server:
        jwt:
          jwk-set-uri: "https://your-keycloak.app/realms/master/protocol/openid-connect/certs"



eureka:
  instance:
    prefer-ip-address: true

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: https://spring-cloud-netflix-eureka-production-cb25.up.railway.app/eureka/